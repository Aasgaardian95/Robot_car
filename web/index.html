<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Robotbil</title>

    <!-- CSS bestemmer hvordan siden ser ut. -->
    <link rel="stylesheet" href="/style.css" />

    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="overtekst">C++ · ROBOTPROSJEKT</p>
        <h1>Robotbil</h1>
      </header>

      <div class="paneler">
        <section class="panel kamera-panel">
          <h2>Kamera</h2>

          <!-- JavaScript starter bildeoppdateringen. -->
          <img id="kamerabilde" alt="Venter på kamerabilde" />
        </section>

        <section class="panel styring-panel">
          <h2>Kontrollpanel</h2>

          <div class="kontrollhjul" role="group" aria-label="Styrekommandoer">
            <button
              type="button"
              class="retning fremover"
              data-kommando="fremover"
            >
              <span class="pil" aria-hidden="true">↑</span>
              <span>Fremover</span>
            </button>

            <button
              type="button"
              class="retning venstre"
              data-kommando="venstre"
            >
              <span class="pil" aria-hidden="true">←</span>
              <span>Venstre</span>
            </button>

            <button type="button" class="stopp" data-kommando="stopp">
              STOPP
            </button>

            <button type="button" class="retning hoyre" data-kommando="hoyre">
              <span class="pil" aria-hidden="true">→</span>
              <span>Høyre</span>
            </button>

            <button
              type="button"
              class="retning bakover"
              data-kommando="bakover"
            >
              <span class="pil" aria-hidden="true">↓</span>
              <span>Bakover</span>
            </button>
          </div>

          <p id="status" aria-live="polite">Venter på kommando.</p>
        </section>
      </div>
    </main>
  </body>
</html>
